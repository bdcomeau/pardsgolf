<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d2318;color:#f5e6b8;min-height:100vh;padding:20px 16px 40px}
  h1{font-size:20px;font-weight:800;color:#c9a84c;text-align:center;margin-bottom:4px}
  .sub{font-size:12px;color:rgba(245,230,184,.5);text-align:center;margin-bottom:24px}
  .card{background:#1a3a2a;border:1.5px solid rgba(201,168,76,.3);border-radius:16px;padding:18px;margin-bottom:14px;max-width:480px;margin-left:auto;margin-right:auto}
  label{font-size:11px;font-weight:700;color:rgba(201,168,76,.7);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
  input,select{width:100%;padding:10px 12px;background:#0d2318;border:1.5px solid rgba(201,168,76,.3);border-radius:10px;color:#f5e6b8;font-size:14px;outline:none;appearance:none;-webkit-appearance:none}
  input::placeholder{color:rgba(245,230,184,.3)}
  input:focus,select:focus{border-color:rgba(201,168,76,.7)}
  .row{display:flex;gap:8px;margin-bottom:12px}
  .row input{flex:1}
  .search-btn{background:#c9a84c;color:#1a3a2a;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .search-btn:active{opacity:.8}
  .results{background:#0d2318;border:1.5px solid rgba(201,168,76,.2);border-radius:10px;margin-top:8px;overflow:hidden;display:none}
  .result-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(201,168,76,.1);font-size:13px;-webkit-tap-highlight-color:transparent}
  .result-item:last-child{border-bottom:none}
  .result-item:active,.result-item.selected{background:rgba(201,168,76,.15)}
  .result-name{font-weight:700;color:#f5e6b8}
  .result-meta{font-size:11px;color:rgba(245,230,184,.5);margin-top:2px}
  .selected-player{background:rgba(201,168,76,.1);border:1.5px solid rgba(201,168,76,.4);border-radius:10px;padding:10px 12px;display:none;margin-top:8px}
  .player-name{font-weight:800;font-size:15px;color:#f5e6b8}
  .player-meta{font-size:12px;color:rgba(245,230,184,.5);margin-top:2px}
  .tee-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .tee-btn{background:#0d2318;border:1.5px solid rgba(201,168,76,.25);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:#f5e6b8;-webkit-tap-highlight-color:transparent}
  .tee-btn:active,.tee-btn.active{background:rgba(201,168,76,.2);border-color:#c9a84c;color:#c9a84c}
  .tee-meta{font-size:10px;color:rgba(245,230,184,.4);font-weight:400;margin-top:2px}
  .result-box{background:#1a3a2a;border:2px solid rgba(201,168,76,.5);border-radius:16px;padding:24px;text-align:center;max-width:480px;margin:0 auto;display:none}
  .result-label{font-size:12px;color:rgba(245,230,184,.5);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
  .result-hcp{font-size:80px;font-weight:900;color:#c9a84c;line-height:1}
  .result-detail{font-size:12px;color:rgba(245,230,184,.4);margin-top:10px;line-height:1.6}
  .result-course{font-size:13px;color:rgba(245,230,184,.6);margin-top:6px}
  .setup-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}

<h1>⛳ Handicap Calculator</h1>
<div class="sub">Pards Golf · powered by Golf Canada</div>

<!-- Credentials setup -->
<div class="card" id="credsCard">
  <label>Golf Canada Credentials</label>
  <div class="creds-note">Same login used in Pards Golf app</div>
  <input type="text" id="gcUser" placeholder="Golf Canada username (email)" style="margin-bottom:8px" autocomplete="username">
  <input type="password" id="gcPass" placeholder="Password" style="margin-bottom:12px" autocomplete="current-password">
  <button class="search-btn" style="width:100%" onclick="saveCreds()">Save & Continue</button>
  <div class="status" id="credsStatus"></div>
</div>

<div class="setup-section" id="mainSection" style="display:none">

  <!-- Player search -->
  <div class="card">
    <label>Golf Canada Member Search</label>
    <div class="row">
      <input type="text" id="searchFirst" placeholder="First name">
      <input type="text" id="searchLast" placeholder="Last name">
      <button class="search-btn" onclick="searchPlayer()">Search</button>
    </div>
    <div class="status" id="searchStatus"></div>
    <div class="results" id="searchResults"></div>
    <div class="selected-player" id="selectedPlayer">
      <div class="player-name" id="playerName"></div>
      <div class="player-meta" id="playerMeta"></div>
    </div>
  </div>

  <!-- Course & tee selection -->
  <div class="card">
    <label style="margin-bottom:8px">Course</label>
    <input type="text" class="course-search" id="courseSearch" placeholder="🔍  Search courses..." oninput="filterCourses()" onfocus="openCourseDropdown()" autocomplete="off">
    <div class="course-dropdown" id="courseDropdown"></div>
    <div class="course-selected-display" id="courseSelectedDisplay" onclick="changeCourse()">
      <div class="course-selected-name" id="courseSelectedName"></div>
      <div class="course-selected-loc" id="courseSelectedLoc"></div>
      <div class="course-change">Tap to change course</div>
    </div>
    <div id="teeSection" style="display:none;margin-top:14px">
      <label>Tee box</label>
      <div class="tee-grid" id="teeGrid"></div>
    </div>
  </div>

  <!-- Result -->
  <div class="result-box" id="resultBox">
    <div class="result-label">Adjusted Course Handicap</div>
    <div class="result-hcp" id="resultHcp">—</div>
    <div class="result-course" id="resultCourse"></div>
    <div class="result-detail" id="resultDetail"></div>
    <button class="reset-btn" onclick="resetAll()">🔄 New Calculation</button>
  </div>

  <div style="text-align:center;margin-top:20px">
    <button onclick="logout()" style="background:none;border:none;color:rgba(245,230,184,.3);font-size:11px;cursor:pointer;text-decoration:underline">Change credentials</button>
  </div>
</div>

// Sort courses for display
const sortedCourses = [...COURSES_DATA].sort((a,b)=>{
  const pa = a.location ? a.location.split(',').pop().trim() : 'ZZ';
  const pb = b.location ? b.location.split(',').pop().trim() : 'ZZ';
  return pa!==pb ? pa.localeCompare(pb) : a.name.localeCompare(b.name);
});

let _token = null, _tokenExp = 0;
let _selectedGid = null, _selectedIndex = null;
let _selectedTee = null, _selectedCourse = null;

// ── Credentials ──────────────────────────────
function saveCreds(){
  const u = document.getElementById('gcUser').value.trim();
  const p = document.getElementById('gcPass').value.trim();
  if(!u||!p){ showStatus('credsStatus','Enter username and password','error'); return; }
  localStorage.setItem('hcp_creds', JSON.stringify({u,p}));
  document.getElementById('credsCard').style.display='none';
  document.getElementById('mainSection').style.display='block';
  buildCourseSelect();
}
function logout(){
  localStorage.removeItem('hcp_creds');
  location.reload();
}
function getCreds(){
  try{ return JSON.parse(localStorage.getItem('hcp_creds')||'{}'); }catch(e){ return {}; }
}

// ── Token ────────────────────────────────────
async function getToken(){
  if(_token && Date.now() < _tokenExp-10000) return _token;
  const c = getCreds();
  const res = await fetch(WORKER+'/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:c.u,password:c.p})});
  if(!res.ok) throw new Error('Login failed ('+res.status+')');
  const d = await res.json();
  _token = d.access_token;
  _tokenExp = Date.now() + ((d.expires_in||3600)*1000);
  return _token;
}

// ── Status helper ────────────────────────────
function showStatus(id, msg, type){
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status' + (type==='error'?' error':'');
  el.style.display = msg ? 'block' : 'none';
}

// ── Course select ────────────────────────────
function buildCourseSelect(){
  renderCourseDropdown(sortedCourses);
}

function renderCourseDropdown(courses){
  const dd = document.getElementById('courseDropdown');
  dd.innerHTML = '';
  let lastProv = '';
  courses.forEach(c=>{
    const prov = c.location ? c.location.split(',').pop().trim() : '';
    if(prov && prov!==lastProv){
      const gl = document.createElement('div');
      gl.className = 'course-group-label';
      gl.textContent = prov;
      dd.appendChild(gl);
      lastProv = prov;
    }
    const div = document.createElement('div');
    div.className = 'course-option';
    div.innerHTML = c.name + (c.location ? '<div class="c-loc">'+c.location+'</div>' : '');
    div.onclick = ()=>selectCourse(c);
    dd.appendChild(div);
  });
}

function openCourseDropdown(){
  document.getElementById('courseDropdown').style.display = 'block';
  renderCourseDropdown(sortedCourses);
}

function filterCourses(){
  const q = document.getElementById('courseSearch').value.toLowerCase();
  const filtered = q ? sortedCourses.filter(c=>c.name.toLowerCase().includes(q)||(c.location||'').toLowerCase().includes(q)) : sortedCourses;
  document.getElementById('courseDropdown').style.display = 'block';
  renderCourseDropdown(filtered);
}

function selectCourse(c){
  _selectedCourse = c;
  _selectedTee = null;
  document.getElementById('courseSearch').style.display = 'none';
  document.getElementById('courseDropdown').style.display = 'none';
  document.getElementById('courseSelectedName').textContent = c.name;
  document.getElementById('courseSelectedLoc').textContent = c.location || '';
  document.getElementById('courseSelectedDisplay').style.display = 'block';
  document.getElementById('teeSection').style.display = 'block';
  buildTeeGrid(c);
  document.getElementById('resultBox').style.display = 'none';
}

function changeCourse(){
  _selectedCourse = null;
  _selectedTee = null;
  document.getElementById('courseSearch').value = '';
  document.getElementById('courseSearch').style.display = 'block';
  document.getElementById('courseSelectedDisplay').style.display = 'none';
  document.getElementById('teeSection').style.display = 'none';
  document.getElementById('resultBox').style.display = 'none';
  document.querySelectorAll('.tee-btn').forEach(b=>b.classList.remove('active'));
  openCourseDropdown();
}

  const grid = document.getElementById('teeGrid');
  grid.innerHTML = '';
  course.tees.forEach((t,i)=>{
    const btn = document.createElement('div');
    btn.className = 'tee-btn';
    btn.innerHTML = t.name+'<div class="tee-meta">'+t.rating+' / '+t.slope+'</div>';
    btn.onclick = ()=>selectTee(t, btn);
    grid.appendChild(btn);
  });
}

function selectTee(tee, btn){
  document.querySelectorAll('.tee-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  _selectedTee = tee;
  calcHandicap();
}

// ── Player search ────────────────────────────
async function searchPlayer(){
  const first = document.getElementById('searchFirst').value.trim();
  const last = document.getElementById('searchLast').value.trim();
  if(!last){ showStatus('searchStatus','Enter at least a last name','error'); return; }
  showStatus('searchStatus','Searching…');
  document.getElementById('searchResults').style.display='none';
  document.getElementById('selectedPlayer').style.display='none';
  document.getElementById('resultBox').style.display='none';
  _selectedGid=null; _selectedIndex=null;
  try{
    const token = await getToken();
    const kw = last.toLowerCase() + (first ? ', '+first.toLowerCase() : '');
    const res = await fetch(WORKER+'/member/search?keywords='+encodeURIComponent(kw)+'&take=20',{
      headers:{'Authorization':'Bearer '+token}
    });
    if(!res.ok) throw new Error('Search failed ('+res.status+')');
    const d = await res.json();
    const members = d.data || [];
    if(!members.length){ showStatus('searchStatus','No results found'); return; }
    showStatus('searchStatus','');
    const resultsEl = document.getElementById('searchResults');
    resultsEl.innerHTML = '';
    members.forEach(m=>{
      const div = document.createElement('div');
      div.className = 'result-item';
      const fullName = ((m.firstName||'')+' '+(m.lastName||'')).trim();
      const gcId = m.golfCanadaCardId || '';
      const hdcp = (m.displayHandicap && m.displayHandicap!=='NA') ? m.displayHandicap : null;
      const club = m.clubName || '';
      const sub = [club, hdcp ? 'Index '+hdcp : ''].filter(Boolean).join(' · ');
      div.innerHTML = '<div class="result-name">'+fullName+'</div><div class="result-meta">GC '+gcId+(sub?' · '+sub:'')+'</div>';
      div.onclick = ()=>selectPlayer(m);
      resultsEl.appendChild(div);
    });
    resultsEl.style.display = 'block';
  }catch(e){
    showStatus('searchStatus', e.message, 'error');
  }
}

function selectPlayer(m){
  const fullName = ((m.firstName||'')+' '+(m.lastName||'')).trim();
  const gcId = m.golfCanadaCardId || '';
  const hdcp = (m.displayHandicap && m.displayHandicap!=='NA') ? parseFloat(m.displayHandicap) : null;
  _selectedGid = gcId;
  _selectedIndex = hdcp;
  document.getElementById('playerName').textContent = fullName;
  document.getElementById('playerMeta').textContent = 'GC '+gcId+(hdcp!=null?' · Index '+hdcp:'') + (m.clubName ? ' · '+m.clubName : '');
  document.getElementById('selectedPlayer').style.display = 'block';
  document.getElementById('searchResults').style.display = 'none';
  showStatus('searchStatus','');
  calcHandicap();
}

// ── Handicap calculation ─────────────────────
function calcHandicap(){
  if(_selectedIndex==null || !_selectedTee || !_selectedCourse) return;
  const t = _selectedTee;
  const coursePar = t.par || 72;
  const raw = (_selectedIndex * t.slope / 113) + (t.rating - coursePar);
  const adj = Math.round(raw);
  document.getElementById('resultHcp').textContent = adj >= 0 ? '+'+adj : adj;
  document.getElementById('resultCourse').textContent = _selectedCourse.name+' · '+t.name+' ('+t.rating+'/'+t.slope+')';
  document.getElementById('resultDetail').innerHTML =
    'Index '+_selectedIndex+' × '+t.slope+' ÷ 113 + ('+t.rating+' − '+coursePar+')'
    +'<br>= '+raw.toFixed(1)+' → rounded to <strong>'+adj+'</strong>';
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('resultBox').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function resetAll(){
  _selectedGid=null; _selectedIndex=null; _selectedTee=null; _selectedCourse=null;
  document.getElementById('searchFirst').value='';
  document.getElementById('searchLast').value='';
  document.getElementById('searchResults').style.display='none';
  document.getElementById('selectedPlayer').style.display='none';
  changeCourse();
  document.getElementById('teeSection').style.display='none';
  document.getElementById('resultBox').style.display='none';
  document.querySelectorAll('.tee-btn').forEach(b=>b.classList.remove('active'));
  showStatus('searchStatus','');
  window.scrollTo(0,0);
}

// Close dropdown on outside click
document.addEventListener('click', function(e){
  const dd = document.getElementById('courseDropdown');
  const cs = document.getElementById('courseSearch');
  if(dd && cs && !dd.contains(e.target) && e.target!==cs){
    dd.style.display='none';
  }
});

// ── Init ──────────────────────────────────────
(function(){
  const c = getCreds();
  if(c.u && c.p){
    document.getElementById('credsCard').style.display='none';
    document.getElementById('mainSection').style.display='block';
    buildCourseSelect();
  }
})();
</script>
