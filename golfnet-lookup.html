<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolfNet Course Lookup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green-dark:#1a3a2a; --green-mid:#2d5a3d; --green-light:#3d7a52;
    --gold:#c9a84c; --gold-light:#e8c97a;
    --white:#fff; --gray-1:#f0ede8; --gray-2:#d8d3cc; --gray-3:#8a8580;
    --text:#1a1a18; --text-muted:#5a5850; --red:#c0392b;
    --font-d:'Georgia',serif; --font-b:system-ui,-apple-system,sans-serif; --font-m:'Courier New',monospace;
  }
  body { background:var(--green-dark); font-family:var(--font-b); color:var(--text); min-height:100vh; }
  header { background:linear-gradient(135deg,var(--green-dark),var(--green-mid)); border-bottom:2px solid var(--gold); padding:20px 32px; display:flex; align-items:center; gap:16px; }
  .logo { width:44px;height:44px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0; }
  header h1 { font-family:var(--font-d);color:#fff;font-size:22px;font-weight:normal; }
  header p  { color:var(--gold-light);font-size:12px;margin-top:2px; }
  main { max-width:1200px;margin:0 auto;padding:28px 24px; }
  .panel { background:#fff;border-radius:10px;padding:22px;margin-bottom:18px;box-shadow:0 4px 20px rgba(0,0,0,.3); }
  .panel h2 { font-family:var(--font-d);font-size:12px;color:var(--green-dark);margin-bottom:14px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--gray-2);padding-bottom:8px; }
  .grid3 { display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;align-items:end; }
  .grid4 { display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end; }
  .grid3i{ display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end; }
  .field { display:flex;flex-direction:column;gap:5px; }
  .field label { font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted); }
  .field input { border:1.5px solid var(--gray-2);border-radius:6px;padding:9px 12px;font-size:14px;color:var(--text);background:#f7f3ec;width:100%; }
  .field input:focus { outline:none;border-color:var(--green-light);background:#fff; }
  .field input.mono { font-family:var(--font-m);font-size:13px; }
  .cred-note { font-size:12px;margin-top:10px;padding:8px 12px;border-radius:6px;display:none; }
  .cred-note.ok  { background:#dff0e8;color:var(--green-dark);display:block; }
  .cred-note.err { background:#fdecea;color:var(--red);display:block; }
  .btn { border:none;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;height:40px;white-space:nowrap;transition:background .15s; }
  .btn:disabled { opacity:.5;cursor:not-allowed; }
  .btn-p { background:var(--green-mid);color:#fff; } .btn-p:hover:not(:disabled){background:var(--green-light);}
  .btn-s { background:var(--gray-1);color:var(--text);border:1.5px solid var(--gray-2); } .btn-s:hover:not(:disabled){background:var(--gray-2);}
  .btn-g { background:var(--gold);color:var(--green-dark);font-size:13px; } .btn-g:hover:not(:disabled){background:var(--gold-light);}
  .status { border-left:3px solid var(--gold);border-radius:0 6px 6px 0;padding:10px 14px;font-size:13px;color:var(--text-muted);margin-bottom:16px;display:none;background:#f7f3ec; }
  .status.err { border-left-color:var(--red);color:var(--red); }
  .status.on  { display:block; }
  .rcard { background:#fff;border-radius:8px;padding:14px 18px;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:space-between;margin-bottom:8px; }
  .rcard:hover{border-color:var(--gold);} .rcard.sel{border-color:var(--green-mid);background:#f0f8f3;}
  .rcard h3 { font-size:15px;color:var(--green-dark);font-family:var(--font-d); }
  .rcard p  { font-size:12px;color:var(--text-muted);margin-top:3px; }
  .rid { text-align:right; } .rid strong{display:block;font-size:20px;color:var(--green-mid);font-family:var(--font-m);} .rid span{font-size:10px;color:var(--text-muted);}
  .cols { display:grid;gap:18px;margin-bottom:18px; }
  .cols.two { grid-template-columns:1fr 1fr; }
  .cols.one { grid-template-columns:1fr; }
  .col { background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.3);overflow:hidden; }
  .col-hdr { background:linear-gradient(135deg,var(--green-dark),var(--green-mid));padding:16px 20px;border-bottom:2px solid var(--gold); }
  .col-hdr h3 { font-family:var(--font-d);color:#fff;font-size:16px;font-weight:normal; }
  .col-hdr p  { color:var(--gold-light);font-size:11px;margin-top:3px; }
  .col-body { padding:16px 18px; }
  .vtabs { display:flex;gap:0;margin-bottom:12px;border:1.5px solid var(--gray-2);border-radius:6px;overflow:hidden; }
  .vtab { flex:1;padding:7px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;background:#fff;color:var(--text-muted);border:none;transition:all .15s; }
  .vtab.on { background:var(--green-mid);color:#fff; } .vtab:hover:not(.on){background:var(--gray-1);}
  .igrid { display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px; }
  .icell { background:var(--gray-1);border-radius:5px;padding:9px 11px; }
  .icell label { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gray-3);display:block;margin-bottom:2px; }
  .icell span  { font-size:13px;color:var(--text);font-weight:500;word-break:break-all; }
  .tlabel { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);display:block;margin:12px 0 5px; }
  .ttabs { display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px; }
  .ttab { border:1.5px solid var(--gray-2);background:#fff;border-radius:20px;padding:4px 11px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px; }
  .ttab:hover{border-color:var(--green-light);} .ttab.on{background:var(--green-mid);color:#fff;border-color:var(--green-mid);}
  .tdot { width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15);flex-shrink:0; }
  .tstats { display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px; }
  .tstat { background:var(--green-dark);border-radius:5px;padding:9px 10px;color:#fff; }
  .tstat label { font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--gold-light);display:block;margin-bottom:2px; }
  .tstat span  { font-size:16px;font-family:var(--font-d); }
  .tstat small { font-size:10px;color:var(--gray-2); }
  .sc-wrap { overflow-x:auto; }
  table { width:100%;border-collapse:collapse;font-size:11px;min-width:380px; }
  thead th { background:var(--green-dark);color:var(--gold-light);padding:5px 4px;text-align:center;font-size:9px;text-transform:uppercase;font-weight:600; }
  thead th:first-child{text-align:left;padding-left:8px;}
  tbody tr:nth-child(even){background:var(--gray-1);} tbody tr:hover{background:#dff0e8;}
  tbody td { padding:5px 4px;text-align:center;border-bottom:1px solid var(--gray-2); }
  tbody td:first-child{text-align:left;padding-left:8px;font-weight:600;}
  .json-box { background:#1e1e1e;color:#d4d4d4;border-radius:6px;padding:14px;font-family:var(--font-m);font-size:11px;overflow:auto;max-height:420px;white-space:pre;margin-top:6px; }
  .ebar { background:#fff;border-radius:10px;padding:14px 18px;box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px; }
  .ebar span { font-size:11px;color:var(--text-muted); }
  .amenities { display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--gray-2); }
  .am { background:var(--gray-1);border-radius:4px;padding:3px 9px;font-size:11px;color:var(--text-muted); }
  .am.y { background:#dff0e8;color:var(--green-dark);font-weight:600; }
  .spin { display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:5px; }
  .spin.dk { border:2px solid var(--gray-2);border-top-color:var(--green-mid); }
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:800px){.cols.two{grid-template-columns:1fr}.grid3,.grid4,.grid3i{grid-template-columns:1fr}header{padding:14px 16px}main{padding:14px 10px}}
</style>
</head>
<body>
<header>
  <div class="logo">⛳</div>
  <div><h1>GolfNet Course Lookup</h1><p>Live Golf Canada · /course/get · Tees, ratings, slopes, handicaps</p></div>
</header>
<main>

  <!-- Credentials -->
  <div class="panel">
    <h2>Golf Canada Login</h2>
    <div class="grid3">
      <div class="field"><label>Cloudflare Worker URL</label><input id="workerUrl" class="mono" value="https://gc-proxy.bdapple.workers.dev"></div>
      <div class="field"><label>Username</label><input id="gcUser" type="text" placeholder="email@example.com" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="gcPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:10px">
      <button class="btn btn-p" onclick="saveAndTest()">Save &amp; Test Login</button>
      <button class="btn btn-s" onclick="clearCreds()">Clear</button>
    </div>
    <div class="cred-note" id="credNote"></div>
  </div>

  <!-- Keyword search -->
  <div class="panel">
    <h2>Search by Keyword + Location</h2>
    <div class="grid3">
      <div class="field"><label>Keyword</label><input id="keywords" value="Derrick"></div>
      <div class="field"><label>Coordinates — paste from Google Maps (any format)</label><div style="display:flex;gap:6px;align-items:center"><input id="coords" placeholder="53.46752, -113.54290  or  (33.5202, -82.0201)" value="53.46752451538905, -113.54290708863726" style="flex:1"><button class="btn btn-s" style="height:40px;padding:0 12px;font-size:12px;flex-shrink:0" onclick="document.getElementById('coords').value='';document.getElementById('coords').focus()">Clear</button></div></div>
      <button class="btn btn-p" id="btnSearch" onclick="searchCourses()">Search</button>
    </div>
  </div>

  <!-- Direct ID lookup -->
  <div class="panel">
    <h2>Direct Lookup by GolfNet ID</h2>
    <div class="grid3i">
      <div class="field"><label>GolfNet ID #1</label><input id="id1" class="mono" placeholder="e.g. 18662"></div>
      <div class="field"><label>GolfNet ID #2 (optional)</label><input id="id2" class="mono" placeholder="e.g. 17982"></div>
      <button class="btn btn-p" id="btnFetch" onclick="directLookup()">Fetch</button>
    </div>
  </div>

  <div class="status" id="statusBar"></div>
  <div id="resultsList"></div>
  <div class="cols" id="detailCols" style="display:none"></div>
  <div class="ebar" id="exportBar" style="display:none"></div>

</main>
<script>
const SK = 'pards_gc';
let _tok=null, _tokExp=0, courseData={};

function loadCreds(){ try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return{}} }
function saveCreds(c){ try{localStorage.setItem(SK,JSON.stringify(c))}catch(e){} }

window.addEventListener('DOMContentLoaded',()=>{
  const c=loadCreds();
  if(c.worker)   document.getElementById('workerUrl').value=c.worker;
  if(c.username) document.getElementById('gcUser').value=c.username;
  if(c.password) document.getElementById('gcPass').value=c.password;
  if(c.worker&&c.username&&c.password) credNote('✓ Credentials loaded — ready to search.',true);
  ['keywords','coords','id1','id2'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')(id==='keywords'?searchCourses:directLookup)()});
  });
});

function credNote(msg,ok){const el=document.getElementById('credNote');el.textContent=msg;el.className='cred-note '+(ok?'ok':'err');}

async function saveAndTest(){
  const w=document.getElementById('workerUrl').value.trim();
  const u=document.getElementById('gcUser').value.trim();
  const p=document.getElementById('gcPass').value;
  if(!w||!u||!p){credNote('Fill in all three fields.',false);return;}
  saveCreds({...loadCreds(),worker:w,username:u,password:p});
  _tok=null;_tokExp=0;
  credNote('Testing…',true);
  try{await getToken();credNote('✓ Login successful — credentials saved.',true);}
  catch(e){credNote('✗ '+e.message,false);}
}
function clearCreds(){localStorage.removeItem(SK);_tok=null;_tokExp=0;document.getElementById('gcUser').value='';document.getElementById('gcPass').value='';credNote('Cleared.',true);}

function wBase(){return(loadCreds().worker||'https://gc-proxy.bdapple.workers.dev').replace(/\/+$/,'');}

async function getToken(){
  const now=Date.now();
  if(_tok&&now<_tokExp-10000)return _tok;
  const c=loadCreds();
  if(!c.worker||!c.username||!c.password)throw new Error('No credentials saved.');
  const r=await fetch(c.worker.replace(/\/+$/,'')+'/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:c.username,password:c.password})});
  if(!r.ok){const t=await r.text();throw new Error('Login failed ('+r.status+'): '+t.slice(0,120));}
  const d=await r.json();
  if(!d.access_token)throw new Error('No token returned.');
  _tok=d.access_token;_tokExp=now+((d.expires_in||3600)*1000);
  return _tok;
}

function showStatus(msg,err=false){const el=document.getElementById('statusBar');el.innerHTML=msg;el.className='status on'+(err?' err':'');}
function hideStatus(){document.getElementById('statusBar').className='status';}

// ── Parse coordinates — handles multiple Google Maps formats ──
function parseCoords(raw) {
  // Strip parens, whitespace, and common wrappers
  const clean = raw.replace(/[()°]/g, '').trim();
  // Match two decimal numbers (with optional sign)
  const match = clean.match(/(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)/);
  if (match) return { lat: match[1], lon: match[2] };
  return { lat: '53.46752', lon: '-113.5429' }; // Edmonton fallback
}

// ── Keyword search ──
async function searchCourses(){
  const kw=document.getElementById('keywords').value.trim();
  const {lat, lon} = parseCoords(document.getElementById('coords').value);
  if(!kw){showStatus('Enter a keyword.',true);return;}
  const btn=document.getElementById('btnSearch');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Searching…';
  document.getElementById('resultsList').innerHTML='';
  document.getElementById('detailCols').style.display='none';
  document.getElementById('exportBar').style.display='none';
  showStatus('<span class="spin dk"></span>Searching…');
  try{
    const tok=await getToken();
    const p=new URLSearchParams({keywords:kw,lat:lat||'53.46752',lon:lon||'-113.5429',proximity:50,skip:0,take:10});
    const r=await fetch(wBase()+'/course/search?'+p,{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    renderResults(d.data||[]);
  }catch(e){showStatus('Search failed: '+e.message,true);}
  finally{btn.disabled=false;btn.textContent='Search';}
}

function renderResults(courses){
  const el=document.getElementById('resultsList');
  if(!courses.length){showStatus('No courses found.');return;}
  showStatus(courses.length+' course'+(courses.length>1?'s':'')+' found — click to load.');
  el.innerHTML=courses.map((c,i)=>`
    <div class="rcard" id="rc${i}" onclick="loadFromSearch(${c.id},${i})">
      <div><h3>${c.name}</h3><p>${c.city}, ${c.region} · ${c.class} · ${(c.type||'').replace('EighteenHole','18-hole')}</p></div>
      <div class="rid"><strong>${c.id}</strong><span>GolfNet ID</span></div>
    </div>`).join('');
}

async function loadFromSearch(id,idx){
  document.querySelectorAll('.rcard').forEach(c=>c.classList.remove('sel'));
  const card=document.getElementById('rc'+idx);if(card)card.classList.add('sel');
  document.getElementById('id1').value=id;
  document.getElementById('id2').value='';
  await fetchAndRender(id,null);
}

// ── Direct lookup ──
async function directLookup(){
  const id1=document.getElementById('id1').value.trim();
  const id2=document.getElementById('id2').value.trim();
  if(!id1){showStatus('Enter at least one GolfNet ID.',true);return;}
  const btn=document.getElementById('btnFetch');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Fetching…';
  document.getElementById('detailCols').style.display='none';
  document.getElementById('exportBar').style.display='none';
  showStatus('<span class="spin dk"></span>Fetching course data…');
  try{await fetchAndRender(id1,id2||null);}
  finally{btn.disabled=false;btn.textContent='Fetch';}
}

// ── Core fetch — /course/get only ──
async function fetchAndRender(id1,id2){
  courseData={};
  try{
    const tok=await getToken();

    const r1=await fetch(wBase()+'/course/get?courseId='+id1,{headers:{Authorization:'Bearer '+tok}});
    if(!r1.ok)throw new Error('ID '+id1+' returned HTTP '+r1.status);
    const c1=await r1.json();
    if(!c1||!c1.id)throw new Error('No data returned for ID '+id1+'. Check the ID is correct.');
    courseData[1]={course:c1,id:id1};

    let c2=null;
    if(id2){
      const r2=await fetch(wBase()+'/course/get?courseId='+id2,{headers:{Authorization:'Bearer '+tok}});
      if(!r2.ok)throw new Error('ID '+id2+' returned HTTP '+r2.status);
      c2=await r2.json();
      if(!c2||!c2.id)throw new Error('No data returned for ID '+id2+'. Check the ID is correct.');
      courseData[2]={course:c2,id:id2};
    }

    hideStatus();
    renderCols(id1,c1,id2,c2);
  }catch(e){showStatus('Fetch failed: '+e.message,true);}
}

// ── Render columns ──
function renderCols(id1,c1,id2,c2){
  const el=document.getElementById('detailCols');
  el.className='cols '+(id2?'two':'one');
  el.style.display='grid';
  el.innerHTML=buildCol(1,c1)+(id2?buildCol(2,c2):'');

  // store tee refs
  [1,2].forEach(s=>{
    const c=courseData[s]&&courseData[s].course;
    window['_mt'+s]=(c&&c.tees||[]).filter(t=>t.type==='Mens');
    window['_wt'+s]=(c&&c.tees||[]).filter(t=>t.type==='Womens');
  });

  // export bar
  const eb=document.getElementById('exportBar');
  eb.style.display='flex';
  eb.innerHTML=`
    <button class="btn btn-g" onclick="copyJSON(1)">Copy #${id1} JSON</button>
    <button class="btn btn-g" onclick="copyPards(1)">Copy #${id1} Pards Format</button>
    ${id2?`<button class="btn btn-g" onclick="copyJSON(2)">Copy #${id2} JSON</button><button class="btn btn-g" onclick="copyPards(2)">Copy #${id2} Pards Format</button>`:''}
    <span>Paste Pards Format directly into course data</span>`;

  el.scrollIntoView({behavior:'smooth',block:'start'});
}

const AM_LIST=[['drivingRange','Driving Range'],['lessons','Lessons'],['proShop','Pro Shop'],['restaurant','Restaurant'],['rentalClubs','Rental Clubs'],['pgaMembers','PGA Members'],['leagues','Leagues'],['juniorMembership','Junior Membership'],['eventBooking','Events'],['accomodations','Accommodations']];

function buildCol(slot,c){
  const mt=(c.tees||[]).filter(t=>t.type==='Mens');
  const wt=(c.tees||[]).filter(t=>t.type==='Womens');
  const hasTees=mt.length||wt.length;
  return `
  <div class="col">
    <div class="col-hdr">
      <h3>${c.name||c.facilityName||'Course'} <span style="font-size:12px;opacity:.6">#${c.id}</span></h3>
      <p>${[c.address1,c.city,c.region,c.postalCode].filter(Boolean).join(', ')}</p>
    </div>
    <div class="col-body">
      <div class="vtabs">
        <div class="vtab on"  id="vt${slot}i" onclick="sv(${slot},'i')">Info</div>
        <div class="vtab"     id="vt${slot}t" onclick="sv(${slot},'t')">Tees &amp; Scorecard</div>
        <div class="vtab"     id="vt${slot}r" onclick="sv(${slot},'r')">Raw JSON</div>
      </div>

      <!-- Info -->
      <div id="vv${slot}i">
        <div class="igrid">
          <div class="icell"><label>GolfNet ID</label><span>${c.id}</span></div>
          <div class="icell"><label>iGolf ID</label><span>${c.iGolfId||'—'}</span></div>
          <div class="icell"><label>Class</label><span>${c.class||'—'}</span></div>
          <div class="icell"><label>Type</label><span>${(c.type||'').replace('EighteenHole','18-hole')}</span></div>
          <div class="icell"><label>Par</label><span>${c.par||'—'}</span></div>
          <div class="icell"><label>Yards</label><span>${c.courseLength?c.courseLength.toLocaleString():'—'}</span></div>
          <div class="icell"><label>Phone</label><span>${c.phone||'—'}</span></div>
          <div class="icell"><label>Email</label><span style="font-size:11px">${c.email||'—'}</span></div>
          <div class="icell"><label>Website</label><span style="font-size:11px">${c.url||'—'}</span></div>
          <div class="icell"><label>Coords</label><span style="font-size:11px">${c.latitude||'—'}, ${c.longitude||'—'}</span></div>
          <div class="icell"><label>Association</label><span style="font-size:11px">${c.regionalAssociation||'—'}</span></div>
          <div class="icell"><label>Est.</label><span>${c.yearEstablished||'—'}</span></div>
        </div>
        <div class="amenities">
          ${AM_LIST.map(([k,l])=>c[k]!==undefined?`<span class="am ${c[k]?'y':''}">${c[k]?'✓ ':''}${l}</span>`:'').join('')}
        </div>
      </div>

      <!-- Tees -->
      <div id="vv${slot}t" style="display:none">
        ${hasTees?`
          ${mt.length?`
            <span class="tlabel">Men's Tees</span>
            <div class="ttabs" id="mt${slot}">
              ${mt.map((t,i)=>`<div class="ttab ${i===0?'on':''}" onclick="selTee(${slot},'m',${i})"><span class="tdot" style="background:${tc(t.color)}"></span>${t.name}</div>`).join('')}
            </div>
            <div id="md${slot}">${teeDetail(mt[0])}</div>
          `:''}
          ${wt.length?`
            <span class="tlabel">Women's Tees</span>
            <div class="ttabs" id="wt${slot}">
              ${wt.map((t,i)=>`<div class="ttab ${i===0?'on':''}" onclick="selTee(${slot},'w',${i})"><span class="tdot" style="background:${tc(t.color)}"></span>${t.name}</div>`).join('')}
            </div>
            <div id="wd${slot}">${teeDetail(wt[0])}</div>
          `:''}
        `:'<p style="font-size:12px;color:var(--text-muted)">No tee data returned.</p>'}
      </div>

      <!-- Raw JSON -->
      <div id="vv${slot}r" style="display:none">
        <div class="json-box">${esc(JSON.stringify(c,null,2))}</div>
      </div>
    </div>
  </div>`;
}

function sv(slot,view){
  ['i','t','r'].forEach(v=>{
    document.getElementById('vv'+slot+v).style.display=v===view?'block':'none';
    document.getElementById('vt'+slot+v).className='vtab'+(v===view?' on':'');
  });
}

function selTee(slot,gender,idx){
  const gender_key=gender==='m'?'_mt':'_wt';
  const tabs_id=gender==='m'?'mt':'wt';
  const detail_id=gender==='m'?'md':'wd';
  document.querySelectorAll('#'+tabs_id+slot+' .ttab').forEach((t,i)=>t.classList.toggle('on',i===idx));
  document.getElementById(detail_id+slot).innerHTML=teeDetail(window[gender_key+slot][idx]);
}

function tc(color){
  return {Black:'#222',Blue:'#1565c0',Silver:'#9e9e9e',Gold:'#f9a825',Green:'#2e7d32',LightGreen:'#66bb6a',White:'#bdbdbd',Red:'#c62828',Orange:'#e65100'}[color]||'#888';
}

function teeDetail(t){
  if(!t)return'';
  const h=t.holes||[];
  const f=h.filter(x=>x.number<=9),b=h.filter(x=>x.number>=10);
  const fY=f.reduce((s,x)=>s+x.yardage,0),bY=b.reduce((s,x)=>s+x.yardage,0);
  const fP=f.reduce((s,x)=>s+x.par,0),bP=b.reduce((s,x)=>s+x.par,0);
  return `
    <div class="tstats">
      <div class="tstat"><label>Yards</label><span>${t.yardage.toLocaleString()}</span></div>
      <div class="tstat"><label>Par</label><span>${t.par}</span></div>
      <div class="tstat"><label>Rating</label><span>${t.rating}</span></div>
      <div class="tstat"><label>Slope</label><span>${t.slope}</span></div>
      <div class="tstat"><label>Front R/S</label><span>${t.frontRating}<small>/${t.frontSlope}</small></span></div>
      <div class="tstat"><label>Back R/S</label><span>${t.backRating}<small>/${t.backSlope}</small></span></div>
    </div>
    ${h.length?`<div class="sc-wrap"><table>
      <thead><tr><th>Hole</th>${f.map(x=>`<th>${x.number}</th>`).join('')}<th>Out</th>${b.map(x=>`<th>${x.number}</th>`).join('')}<th>In</th><th>Tot</th></tr></thead>
      <tbody>
        <tr><td>Par</td>${f.map(x=>`<td>${x.par}</td>`).join('')}<td>${fP}</td>${b.map(x=>`<td>${x.par}</td>`).join('')}<td>${bP}</td><td>${t.par}</td></tr>
        <tr><td>Yds</td>${f.map(x=>`<td>${x.yardage}</td>`).join('')}<td>${fY}</td>${b.map(x=>`<td>${x.yardage}</td>`).join('')}<td>${bY}</td><td>${t.yardage}</td></tr>
        <tr><td>HCP</td>${f.map(x=>`<td>${x.handicap}</td>`).join('')}<td>—</td>${b.map(x=>`<td>${x.handicap}</td>`).join('')}<td>—</td><td>—</td></tr>
      </tbody>
    </table></div>`:''}`;
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function copyJSON(slot){
  const d=courseData[slot];if(!d)return;
  navigator.clipboard.writeText(JSON.stringify(d.course,null,2)).then(()=>showStatus('✓ Raw JSON for ID '+d.id+' copied.'));
}

function copyPards(slot){
  const d=courseData[slot];if(!d)return;
  const c=d.course;
  const mt=(c.tees||[]).filter(t=>t.type==='Mens');
  const lines=mt.map(t=>{
    const h=t.holes||[];
    return `  { name:"${t.name}", rating:${t.rating}, slope:${t.slope}, par:${t.par}, yards:${t.yardage},\n    frontRating:${t.frontRating}, backRating:${t.backRating}, frontSlope:${t.frontSlope}, backSlope:${t.backSlope},\n    pars:[${h.map(x=>x.par)}], yards:[${h.map(x=>x.yardage)}], handicaps:[${h.map(x=>x.handicap)}] }`;
  }).join(',\n');
  const out=`// ${c.name}  (GolfNet ID: ${c.id})\n// ${c.address1}, ${c.city}, ${c.region} ${c.postalCode}\n// Coords: ${c.latitude}, ${c.longitude}\ntees: [\n${lines}\n]`;
  navigator.clipboard.writeText(out).then(()=>showStatus('✓ Pards Golf format for ID '+d.id+' copied.'));
}
</script>
</body>
</html>
